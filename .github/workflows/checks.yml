name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m program_library.demo
      - run: python -m program_library.benchmark freeze --output runs/ci
      - run: python -m program_library.benchmark run --output runs/ci
      - run: python -m program_library.verify_results runs/ci
